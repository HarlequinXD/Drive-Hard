plugins {
    id 'com.android.application' version '8.9.3'
}

repositories {
    google()
    mavenCentral()
}

android {
    namespace 'com.harlequinxd.drivehard.android'
    compileSdk 35

    defaultConfig {
        applicationId 'com.harlequinxd.drivehard'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            java {
                srcDirs = ['src/main/java', '../app/src/main/java/com/harlequinxd/drivehard/core']
            }
        }
    }
}
