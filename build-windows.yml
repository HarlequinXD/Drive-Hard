name: Build Windows EXE

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Compile Windows game and dependencies
        shell: pwsh
        run: gradle :app:clean :app:prepareWindowsPackage --stacktrace --no-daemon

      - name: Package Windows EXE with bundled Java
        shell: pwsh
        run: |
          $jar = Get-ChildItem 'app/build/windows-input' -Filter 'app*.jar' | Where-Object { $_.Name -notmatch 'plain' } | Select-Object -First 1
          if (-not $jar) { throw 'Game JAR was not found in app/build/windows-input' }
          New-Item -ItemType Directory -Force -Path 'build/windows' | Out-Null
          jpackage --type app-image --name DriveHard --input app/build/windows-input --main-jar $jar.Name --main-class com.harlequinxd.drivehard.desktop.DesktopMain --dest build/windows --java-options '-Xmx3g'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Compress-Archive -Path 'build/windows/DriveHard' -DestinationPath 'build/DriveHard-Windows.zip' -Force

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: DriveHard-Windows-EXE
          path: build/DriveHard-Windows.zip
          if-no-files-found: error
