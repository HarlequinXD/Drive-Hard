name: Build Windows EXE

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Compile and prepare desktop app
        run: gradle :app:clean :app:prepareWindowsPackage --stacktrace

      - name: Create Windows application with bundled Java
        shell: pwsh
        run: |
          $jar = Get-ChildItem 'app/build/windows-input/*.jar' | Where-Object { $_.Name -like 'app*.jar' } | Select-Object -First 1
          if (-not $jar) { throw 'Desktop application JAR not found' }
          jpackage --type app-image --name DriveHard --input app/build/windows-input --main-jar $jar.Name --main-class com.harlequinxd.drivehard.desktop.DesktopMain --dest app/build/windows-dist --java-options '-Xmx3g'

      - name: Zip Windows game
        shell: pwsh
        run: Compress-Archive -Path 'app/build/windows-dist/DriveHard' -DestinationPath 'DriveHard-Windows.zip'

      - name: Upload Windows game
        uses: actions/upload-artifact@v4
        with:
          name: DriveHard-Windows-EXE
          path: DriveHard-Windows.zip
          if-no-files-found: error
