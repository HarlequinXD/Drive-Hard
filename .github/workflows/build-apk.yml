name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Desktop checks (sprite bake + controller sim)
        run: |
          mkdir -p build/sim
          javac -d build/sim $(find app/src/main/java/com/harlequinxd/drivehard/core -name '*.java') tools/SimTest.java tools/BakePreview.java
          java -cp build/sim SimTest
          java -cp build/sim BakePreview build/preview

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk DriveHard.apk

      - uses: actions/upload-artifact@v4
        with:
          name: DriveHard-apk
          path: DriveHard.apk

      - uses: actions/upload-artifact@v4
        with:
          name: sprite-previews
          path: build/preview/*.png

      - name: Publish rolling "latest" release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest DriveHard.apk \
            --title "Drive Hard latest build" \
            --notes "Automatic build of ${GITHUB_SHA::7}. Download DriveHard.apk on your phone to install." \
            --prerelease
