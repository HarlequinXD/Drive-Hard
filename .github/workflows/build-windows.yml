name: Build Lightweight Windows Game
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Build game JAR and dependencies
        run: gradle :app:clean :app:prepareLightweightWindows --stacktrace --no-daemon
      - name: Enable native Windows C compiler
        uses: ilammy/msvc-dev-cmd@v1
      - name: Compile small EXE launcher
        shell: cmd
        run: cl /nologo /O2 /MT /W4 /DUNICODE /D_UNICODE /Fe:app\build\lightweight-windows\DriveHard.exe windows\launcher.c shell32.lib user32.lib
      - name: Upload game without Java runtime or nested ZIP
        uses: actions/upload-artifact@v4
        with:
          name: DriveHard-Lightweight-Windows
          path: app/build/lightweight-windows/
          if-no-files-found: error
