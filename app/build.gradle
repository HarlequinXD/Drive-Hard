plugins { id 'application' }
repositories { mavenCentral() }
dependencies { implementation 'net.java.dev.jna:jna:5.16.0' }
java { toolchain { languageVersion = JavaLanguageVersion.of(17) } }
sourceSets { main { java { srcDirs = ['src/main/java']; include 'com/harlequinxd/drivehard/core/**'; include 'com/harlequinxd/drivehard/desktop/**' } } }
application { mainClass = 'com.harlequinxd.drivehard.desktop.DesktopMain'; applicationName = 'DriveHard' }
tasks.named('jar') {
    archiveFileName = 'DriveHard.jar'
    manifest {
        attributes('Main-Class': 'com.harlequinxd.drivehard.desktop.DesktopMain',
                   'Class-Path': configurations.runtimeClasspath.files.collect { 'lib/' + it.name }.join(' '))
    }
}
tasks.register('prepareLightweightWindows', Sync) {
    dependsOn tasks.named('jar')
    into layout.buildDirectory.dir('lightweight-windows')
    from(tasks.named('jar'))
    into('lib') { from(configurations.runtimeClasspath) }
}
