plugins {
    id 'com.android.application'
}

android {
    namespace 'com.harlequinxd.drivehard'
    compileSdk 35

    defaultConfig {
        applicationId 'com.harlequinxd.drivehard'
        minSdk 21
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }

    signingConfigs {
        // Fixed key committed to the repo so every CI build installs over the previous one.
        // Not for Play Store release.
        shared {
            storeFile file('drivehard-debug.keystore')
            storePassword 'drivehard'
            keyAlias 'drivehard'
            keyPassword 'drivehard'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.shared
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.shared
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
