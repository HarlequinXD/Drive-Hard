plugins {
    id 'application'
}

repositories { mavenCentral() }

dependencies {
    implementation 'net.java.dev.jna:jna:5.16.0'
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(17) }
}

// Existing Android source files remain in the repository but are excluded
// from the Windows build. Only the shared game core and desktop launcher compile.
sourceSets {
    main {
        java {
            srcDirs = ['src/main/java']
            include 'com/harlequinxd/drivehard/core/**'
            include 'com/harlequinxd/drivehard/desktop/**'
        }
    }
}

application {
    mainClass = 'com.harlequinxd.drivehard.desktop.DesktopMain'
    applicationName = 'DriveHard'
}

tasks.register('prepareWindowsPackage', Sync) {
    dependsOn tasks.named('jar')
    into layout.buildDirectory.dir('windows-input')
    from(tasks.named('jar'))
    from(configurations.runtimeClasspath)
}
